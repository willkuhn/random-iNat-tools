<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Name · random-iNat-tools</title>
<meta name="description" content="One sentence saying what this tool does.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --bg-alt: #f3f5f1;
    --text: #1f2421;
    --text-muted: #5d6660;
    --border: #d6dcd4;
    --accent: #5a8a00;
    --accent-text: #ffffff;
    --link: #2f6f9f;
    --error: #b3261e;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141714;
      --bg-alt: #1e221e;
      --text: #e3e7e2;
      --text-muted: #9aa49c;
      --border: #39403a;
      --accent: #8cc63f;
      --accent-text: #141714;
      --link: #7fb8e6;
      --error: #f2867f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    max-width: 72rem;
    padding: 1rem 1rem 3rem;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 var(--font);
  }
  a { color: var(--link); }
  h1 { margin: 0.5rem 0 0.25rem; font-size: 1.6rem; }
  .lede { margin: 0 0 1.25rem; color: var(--text-muted); }

  form {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem 1rem;
    align-items: flex-end;
    padding: 1rem;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  label { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.85rem; color: var(--text-muted); }
  input, select {
    min-width: 12rem;
    padding: 0.4rem 0.5rem;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  button {
    padding: 0.45rem 1.1rem;
    font: inherit;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: progress; }

  #status { min-height: 1.5em; margin: 1rem 0; color: var(--text-muted); }
  #status.error { color: var(--error); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 0.4rem 0.6rem; text-align: left; border-bottom: 1px solid var(--border); }
  th { font-weight: 600; }
  thead th { position: sticky; top: 0; background: var(--bg-alt); }
  td.num, th.num { text-align: right; }

  footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<header>
  <h1>Tool Name</h1>
  <p class="lede">One or two sentences saying what this tool does and who it's for.</p>
</header>

<main>
  <form id="params-form">
    <!-- Each input's name is the URL parameter it maps to. -->
    <label>Taxon ID
      <input name="taxon_id" inputmode="numeric" placeholder="e.g. 47157">
    </label>
    <label>Place ID
      <input name="place_id" inputmode="numeric" placeholder="optional">
    </label>
    <button type="submit">Go</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>
  <section id="results"></section>
</main>

<footer>
  Part of <a href="https://github.com/willkuhn/random-iNat-tools">random-iNat-tools</a>
  (<a href="https://github.com/willkuhn/random-iNat-tools/tree/main/tools/TOOL-SLUG">docs &amp; source</a>).
  Data from the <a href="https://api.inaturalist.org/v2/docs/">iNaturalist API</a>; observations and media belong to their creators.
  Not affiliated with or endorsed by iNaturalist.
</footer>

<script>
'use strict';

// ---------------------------------------------------------------------------
// iNaturalist API client (v2: https://api.inaturalist.org/v2/docs/)
// Follows https://www.inaturalist.org/pages/api+recommended+practices:
// about 1 request per second, back off on HTTP 429, largest page size,
// and no paging past the 10,000-result ceiling.
// v2 returns only each record's uuid unless `fields` lists the attributes you want,
// e.g. fields: '(id:!t,taxon:(name:!t))'.
// Keep this block identical across tools so fixes can be copied between them.
// ---------------------------------------------------------------------------
const INAT_API = 'https://api.inaturalist.org';
const MIN_REQUEST_INTERVAL_MS = 1000;
const RATE_LIMIT_BACKOFF_MS = 10000;
const MAX_RETRIES = 3;
const MAX_PER_PAGE = 200;
const MAX_RESULTS = 10000;
// Most records one comma-separated ID lookup like /v2/taxa/1,2,3 returns. The v2 docs don't list these;
// they were measured in October 2026. /v2/places silently stops at 200, and /v2/users takes one ID at a time.
// v2 has no identifications search, so identifications still come from v1.
const MAX_IDS_PER_REQUEST = { '/v1/identifications': 30, '/v2/observations': 200, '/v2/places': 200, '/v2/projects': 10, '/v2/taxa': 30 };

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

// Slots are reserved synchronously, so requests fired concurrently still go out one per interval.
let nextRequestAt = 0;
function waitForRequestSlot() {
  const now = Date.now();
  const slot = Math.max(now, nextRequestAt);
  nextRequestAt = slot + MIN_REQUEST_INTERVAL_MS;
  return sleep(slot - now);
}

// GET an API path, e.g. inatFetch('/v2/observations', {taxon_id: 47157, per_page: 0}).
// Params set to undefined or null are left out; an empty string is sent (e.g. `field:Name=` matches any value).
async function inatFetch(path, params = {}) {
  const url = new URL(INAT_API + path);
  for (const [key, value] of Object.entries(params)) {
    if (value !== undefined && value !== null) url.searchParams.set(key, value);
  }
  for (let attempt = 0; ; attempt++) {
    await waitForRequestSlot();
    const response = await fetch(url);
    if (response.status === 429 && attempt < MAX_RETRIES) {
      // Pause every queued request, not just this one, and wait longer on each retry.
      const backoff = RATE_LIMIT_BACKOFF_MS * 2 ** attempt;
      nextRequestAt = Math.max(nextRequestAt, Date.now() + backoff);
      setStatus(`iNaturalist asked us to slow down. Retrying in ${backoff / 1000} seconds…`);
      continue;
    }
    if (!response.ok) {
      throw new Error(`iNaturalist API returned ${response.status} ${response.statusText} for ${url.pathname}`);
    }
    return response.json();
  }
}

// Fetch every result of a search by walking id_above, as iNat recommends instead of deep paging.
// Only for endpoints that accept id_above and order_by=id: /v2/observations, /v2/taxa, /v1/identifications.
// Refuses searches over MAX_RESULTS so users narrow their filters or use an export instead.
async function inatFetchAll(path, params = {}, onProgress = () => {}) {
  const results = [];
  let idAbove;
  let total;
  for (;;) {
    const data = await inatFetch(path, { ...params, per_page: MAX_PER_PAGE, order_by: 'id', order: 'asc', id_above: idAbove });
    if (total === undefined) {
      total = data.total_results;
      if (total > MAX_RESULTS) {
        throw new Error(`This search matches ${formatNumber(total)} records, more than the ${formatNumber(MAX_RESULTS)} this tool will fetch. ` +
          'Add filters to narrow it down, or use iNaturalist\'s observation export (https://www.inaturalist.org/observations/export) for large datasets.');
      }
    }
    results.push(...data.results);
    onProgress(results.length, total);
    if (data.results.length < MAX_PER_PAGE) return results;
    idAbove = data.results[data.results.length - 1].id;
  }
}

// Look up records by ID in as few requests as possible, e.g. inatFetchByIds('/v2/taxa', [1, 2, 3], {fields: '(name:!t)'}).
// /v2/observations/{...} only accepts UUIDs, so observation IDs go in the search's `id` parameter instead.
async function inatFetchByIds(path, ids, params = {}) {
  const batchSize = MAX_IDS_PER_REQUEST[path];
  if (!batchSize) throw new Error(`${path} doesn't support looking up several IDs at once`);
  const unique = [...new Set(ids)];
  const results = [];
  for (let i = 0; i < unique.length; i += batchSize) {
    const batch = unique.slice(i, i + batchSize).join(',');
    const data = path === '/v2/observations'
      ? await inatFetch(path, { ...params, id: batch, per_page: batchSize })
      : await inatFetch(`${path}/${batch}`, params);
    results.push(...data.results);
  }
  return results;
}

// ---------------------------------------------------------------------------
// Page helpers
// ---------------------------------------------------------------------------
const form = document.getElementById('params-form');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

function setStatus(message, isError = false) {
  statusEl.textContent = message;
  statusEl.classList.toggle('error', isError);
}

const formatNumber = n => Number(n).toLocaleString();

// Use for any API-provided text inserted with innerHTML (names, descriptions, etc.).
function escapeHtml(text) {
  return String(text ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
}

// Settings live in the URL so every result can be bookmarked and shared.
function readParamsIntoForm(params) {
  for (const field of form.elements) {
    if (field.name && params.has(field.name)) field.value = params.get(field.name);
  }
}

form.addEventListener('submit', event => {
  event.preventDefault();
  const params = new URLSearchParams();
  for (const [key, value] of new FormData(form)) {
    if (String(value).trim() !== '') params.set(key, String(value).trim());
  }
  location.search = params.toString();
});

// ---------------------------------------------------------------------------
// Tool logic
// ---------------------------------------------------------------------------
async function run(params) {
  setStatus('Counting observations…');
  const data = await inatFetch('/v2/observations', {
    taxon_id: params.get('taxon_id'),
    place_id: params.get('place_id'),
    per_page: 0,
  });
  setStatus('');
  resultsEl.innerHTML = `<p>${formatNumber(data.total_results)} observations match.</p>`;
}

const params = new URLSearchParams(location.search);
readParamsIntoForm(params);
if (params.has('taxon_id')) {
  const button = form.querySelector('button');
  button.disabled = true;
  run(params)
    .catch(err => { console.error(err); setStatus(err.message, true); })
    .finally(() => { button.disabled = false; });
}
</script>
</body>
</html>
